<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - R.S.Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="toast-container"></div>

    <div class="login-container">
        <!-- Left Side: Form -->
        <div class="login-left">
            <div class="brand">
                <div class="logo-icon" style="background: none; width: auto; height: auto;">
                    <img src="assets/logo.jpg" alt="Logo" style="height: 50px; border-radius: 10px;">
                </div>
                <h1>R.S.Portal</h1>
            </div>

            <div class="login-content">
                <h2>Welcome back</h2>
                <p>Enter your credentials to access your workspace.</p>

                <div class="input-group">
                    <label for="email"><i class="fa-regular fa-envelope"></i> Email Address</label>
                    <input type="email" id="email" placeholder="name@company.com" required>
                </div>

                <div class="input-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required>
                        <i class="fa-regular fa-eye-slash toggle-pw"></i>
                    </div>
                </div>

                <a href="#" class="forgot-pw">Forgot Password?</a>

                <button onclick="login()" id="loginBtn" class="btn-primary-lg">
                    <span>Sign in</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

                <div class="divider">
                    <span>or continue with</span>
                </div>

                <div class="social-login-grid">
                    <button class="social-btn google" onclick="window.location.href = API_BASE_URL + '/api/auth/google'">
                        <img src="https://img.icons8.com/color/48/google-logo.png" alt="Google">
                    </button>
                    <button class="social-btn github" onclick="window.location.href = API_BASE_URL + '/api/auth/github'">
                        <i class="fa-brands fa-github"></i>
                    </button>
                    <button class="social-btn facebook" onclick="window.location.href = API_BASE_URL + '/api/auth/facebook'">
                        <i class="fa-brands fa-facebook-f"></i>
                    </button>
                </div>

                <p class="login-link">Don't have an account yet? <a href="register.html">Register for free</a></p>
            </div>
        </div>

        <!-- Right Side: Decorative -->
        <div class="login-right">
            <!-- Background image set in CSS -->
            <div style="position: absolute; bottom: 60px; left: 60px; color: white; z-index: 2; max-width: 400px;">
                <h3 style="font-size: 32px; font-weight: 700; margin-bottom: 15px;">Collaborate without boundaries.</h3>
                <p style="font-size: 18px; opacity: 0.9;">Manage projects, chat with your team, and track tasks all in one place.</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // Toggle Password Visibility
        document.querySelector('.toggle-pw').addEventListener('click', function () {
            const input = this.previousElementSibling;
            if (input.type === "password") {
                input.type = "text";
                this.classList.remove('fa-eye-slash');
                this.classList.add('fa-eye');
            } else {
                input.type = "password";
                this.classList.remove('fa-eye');
                this.classList.add('fa-eye-slash');
            }
        });

        // OAuth Token Handler on Load
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const error = urlParams.get('error');
            const registered = urlParams.get('registered');

            if (registered) {
                showToast("Account created successfully! Please log in.");
            }

            if (token) {
                localStorage.setItem("token", token);
                window.history.replaceState({}, document.title, window.location.pathname);
                showToast("Login successful! Redirecting...");
                
                setTimeout(() => {
                    const user = parseJwt(token);
                    const role = user ? user.role : 'member';
                    window.location.href = role === 'admin' ? "admin-dashboard.html" : "member-dashboard.html";
                }, 1000);
            } else if (error) {
                showToast("Login failed: " + error.replace(/_/g, ' '), "error");
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        });

        async function login() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const btn = document.getElementById("loginBtn");

            if (!email || !password) {
                showToast("Please enter both email and password", "error");
                return;
            }

            const originalContent = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Signing in...';
            btn.disabled = true;

            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok && data.token) {
                    localStorage.setItem("token", data.token);
                    showToast("Login successful! Redirecting...");

                    setTimeout(() => {
                        const user = parseJwt(data.token);
                        const role = user ? user.role : 'member';
                        window.location.href = role === 'admin' ? "admin-dashboard.html" : "member-dashboard.html";
                    }, 1000);
                } else {
                    showToast(data.message || "Invalid credentials", "error");
                    btn.innerHTML = originalContent;
                    btn.disabled = false;
                }
            } catch (error) {
                console.error("Login error:", error);
                showToast("Server error during login.", "error");
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }
        }
    </script>

</body>

</html>
