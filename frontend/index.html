<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - R.S.Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div id="toast-container"></div>

    <div class="login-container">
        <!-- Left Side: Form -->
        <div class="login-left">
            <div class="brand">
                <div class="logo-icon" style="background: none; width: auto; height: auto;">
                    <img src="assets/logo.jpg" alt="Logo" style="height: 50px;">
                </div>
                <h1>R.S.Portal</h1>
            </div>

            <div class="login-content">
                <h2>Login</h2>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="username@gmail.com">
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Password">
                        <i class="fa-regular fa-eye-slash toggle-pw"></i>
                    </div>
                </div>

                <a href="#" class="forgot-pw">Forgot Password?</a>

                <button onclick="login()" class="btn-primary-lg">Sign in</button>

                <div class="divider">
                    <span>or continue with</span>
                </div>

                <div class="social-login">
                    <button class="social-btn" onclick="window.location.href = API_BASE_URL + '/api/auth/google'">
                        <img src="https://img.icons8.com/color/48/google-logo.png" alt="Google">
                        <span>Continue with Google</span>
                    </button>
                    <button class="social-btn" onclick="window.location.href = API_BASE_URL + '/api/auth/github'">
                        <i class="fa-brands fa-github" style="color: #24292e;"></i>
                        <span>Continue with GitHub</span>
                    </button>
                    <button class="social-btn" onclick="window.location.href = API_BASE_URL + '/api/auth/facebook'">
                        <i class="fa-brands fa-facebook-f" style="color: #1877f2;"></i>
                        <span>Continue with Facebook</span>
                    </button>
                </div>

                <p class="mt-4">Don't have an account yet? <a href="register.html">Register for free</a></p>
            </div>
        </div>

        <!-- Right Side: Image -->
        <div class="login-right">
            <!-- Background image set in CSS -->
        </div>
    </div>

    <script>
        /* ================= TOAST LOGIC ================= */
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <div class="toast-content">${message}</div>
            `;
            container.appendChild(toast);

            // Auto remove
            setTimeout(() => {
                toast.style.animation = 'fadeOut 0.3s forwards';
                toast.addEventListener('animationend', () => {
                    toast.remove();
                });
            }, 3000);
        }

        // Toggle Password Visibility
        document.querySelector('.toggle-pw').addEventListener('click', function () {
            const input = this.previousElementSibling;
            if (input.type === "password") {
                input.type = "text";
                this.classList.remove('fa-eye-slash');
                this.classList.add('fa-eye');
            } else {
                input.type = "password";
                this.classList.remove('fa-eye');
                this.classList.add('fa-eye-slash');
            }
        });

        // Parse Token to Check Role
        function parseJwt(token) {
            try { return JSON.parse(atob(token.split(".")[1])); }
            catch (e) { return null; }
        }

        // OAuth Token Handler on Load
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const error = urlParams.get('error');

            if (token) {
                localStorage.setItem("token", token);
                window.history.replaceState({}, document.title, window.location.pathname);
                showToast("Social Login successful! Redirecting...");
                
                setTimeout(() => {
                    const user = parseJwt(token);
                    const role = user ? user.role : 'member';
                    if (role === 'admin') {
                        window.location.href = "admin-dashboard.html";
                    } else {
                        window.location.href = "member-dashboard.html";
                    }
                }, 1000);
            } else if (error) {
                showToast("Social Login failed or was cancelled.", "error");
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        });

        async function login() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            if (!email || !password) {
                showToast("Please enter both email and password", "error");
                return;
            }

            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok && data.token) {
                    localStorage.setItem("token", data.token);

                    localStorage.setItem("token", data.token);

                    const user = parseJwt(data.token);
                    const role = user ? user.role : 'member';

                    showToast("Login successful! Redirecting...");

                    setTimeout(() => {
                        if (role === 'admin') {
                            window.location.href = "admin-dashboard.html";
                        } else {
                            window.location.href = "member-dashboard.html";
                        }
                    }, 1000);
                } else {
                    showToast(data.message || "Login failed", "error");
                }
            } catch (error) {
                console.error("Login error:", error);
                showToast("An error occurred during login.", "error");
            }
        }
    </script>

</body>

</html>
