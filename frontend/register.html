<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - R.S.Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Outfit', sans-serif;
            overflow-x: hidden;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            min-height: 100vh;
        }

        .prism-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('https://images.unsplash.com/photo-1497215728101-856f4ea42174?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80');
            background-size: cover;
            background-position: center;
            opacity: 0.05;
            z-index: -1;
            filter: grayscale(100%);
        }
    </style>
</head>

<body>
    <div class="prism-bg"></div>
    
    <div id="toast-container"></div>

    <div class="register-body">
        <div class="glass-card">
            <!-- Close button -->
            <a href="index.html" class="close-btn" title="Back to Login"><i class="fa-solid fa-xmark"></i></a>

            <div class="glass-left">
                <div class="glass-logo">
                    <img src="assets/logo.jpg" alt="Logo" class="logo-img">
                    <h1>R.S.Portal</h1>
                </div>

                <h2 class="glass-title">Create Account</h2>
                <p class="glass-subtitle">Join our collaborative community today.</p>

                <form id="registerForm" onsubmit="register(event)">
                    <div class="input-container-overhaul">
                        <div class="input-group">
                            <label class="glass-label">Full Name</label>
                            <div class="input-wrapper">
                                <input type="text" id="fullname" class="glass-input" placeholder=" " required>
                                <label class="floating-label"><i class="fa-regular fa-user"></i> Narendra Singh</label>
                            </div>
                        </div>

                        <div class="input-group">
                            <label class="glass-label">E-mail Address</label>
                            <div class="input-wrapper">
                                <input type="email" id="email" class="glass-input" placeholder=" " required>
                                <label class="floating-label"><i class="fa-regular fa-envelope"></i> name@company.com</label>
                            </div>
                        </div>

                        <div class="input-row">
                            <div class="input-group">
                                <label class="glass-label">Password</label>
                                <div class="password-wrapper input-wrapper">
                                    <input type="password" id="password" class="glass-input" placeholder=" " required onkeyup="checkPasswordStrength(this.value)">
                                    <label class="floating-label"><i class="fa-solid fa-lock"></i> Password</label>
                                    <i class="fa-regular fa-eye-slash toggle-pw"></i>
                                </div>
                                <div class="strength-meter">
                                    <div id="strength-bar" class="strength-bar"></div>
                                </div>
                                <small id="strength-text" class="strength-text">Password strength</small>
                            </div>

                            <div class="input-group">
                                <label class="glass-label">Confirm</label>
                                <div class="password-wrapper input-wrapper">
                                    <input type="password" id="confirm-password" class="glass-input" placeholder=" " required>
                                    <label class="floating-label"><i class="fa-solid fa-shield-halved"></i> Confirm</label>
                                    <i class="fa-regular fa-eye-slash toggle-pw"></i>
                                </div>
                            </div>
                        </div>

                        <div class="input-row">
                            <div class="input-group">
                                <label class="glass-label">Role</label>
                                <select id="role" class="glass-input select-input">
                                    <option value="member">Member</option>
                                    <option value="admin">Admin</option>
                                </select>
                            </div>

                            <div class="input-group">
                                <label class="glass-label">Designation</label>
                                <select id="designation" class="glass-input select-input">
                                    <option value="Full-Stack Developer">Full-Stack Developer</option>
                                    <option value="Frontend Developer">Frontend Developer</option>
                                    <option value="Backend Developer">Backend Developer</option>
                                    <option value="UI-Designer">UI-Designer</option>
                                    <option value="Designer">Designer</option>
                                    <option value="Project Manager">Project Manager</option>
                                    <option value="Tester">Tester</option>
                                    <option value="Member">Member</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <div class="glass-right">
                <div class="avatar-section">
                    <label class="glass-label" style="justify-content: center; margin-bottom: 24px;">Profile Picture</label>

                    <div class="main-avatar" id="avatarPreviewContainer">
                        <i class="fa-regular fa-user" id="defaultAvatarIcon"></i>
                        <img id="avatarPreview" src="" style="display: none; width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">
                        <button class="upload-btn" type="button" onclick="document.getElementById('file-upload').click()">
                            <i class="fa-solid fa-camera"></i>
                        </button>
                        <!-- Hidden file input -->
                        <input type="file" id="file-upload" style="display: none;" accept="image/*">
                    </div>

                    <div class="or-divider">Optional: Select an Avatar</div>

                    <div class="avatar-options">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" class="avatar-option"
                            onclick="selectAvatar(this)" data-url="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Aneka" class="avatar-option"
                            onclick="selectAvatar(this)" data-url="https://api.dicebear.com/7.x/avataaars/svg?seed=Aneka">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Bob" class="avatar-option"
                            onclick="selectAvatar(this)" data-url="https://api.dicebear.com/7.x/avataaars/svg?seed=Bob">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Jack" class="avatar-option"
                            onclick="selectAvatar(this)" data-url="https://api.dicebear.com/7.x/avataaars/svg?seed=Jack">
                    </div>
                    <input type="hidden" id="selectedAvatarUrl" value="">
                </div>

                <div class="action-section">
                    <button class="premium-btn-overhaul" type="button" onclick="register(event)">
                        <span>Register Now</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>

                    <div class="auth-divider">
                        <span>Or Register With</span>
                    </div>

                    <div class="social-login-grid-overhaul">
                        <button class="social-btn-premium" type="button" onclick="window.location.href = '/api/auth/google'">
                            <img src="https://img.icons8.com/color/48/google-logo.png" alt="Google">
                            <span>Google</span>
                        </button>
                        <button class="social-btn-premium" type="button" onclick="window.location.href = '/api/auth/github'">
                            <i class="fa-brands fa-github" style="color: #333;"></i>
                            <span>GitHub</span>
                        </button>
                        <button class="social-btn-premium" type="button" onclick="window.location.href = '/api/auth/facebook'">
                            <i class="fa-brands fa-facebook" style="color: #1877F2;"></i>
                            <span>Facebook</span>
                        </button>
                    </div>

                    <p class="login-link">Already have an account? <a href="index.html">Sign In</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        let currentAvatarUrl = "";

        // Avatar Selection Logic
        function selectAvatar(imgElement) {
            document.querySelectorAll('.avatar-option').forEach(img => img.classList.remove('selected'));
            imgElement.classList.add('selected');
            
            const url = imgElement.getAttribute('data-url');
            currentAvatarUrl = url;
            document.getElementById('selectedAvatarUrl').value = url;
            
            // Update preview
            const preview = document.getElementById('avatarPreview');
            const icon = document.getElementById('defaultAvatarIcon');
            preview.src = url;
            preview.style.display = 'block';
            icon.style.display = 'none';
        }

        // Toggle Password Visibility
        document.querySelectorAll('.toggle-pw').forEach(icon => {
            icon.addEventListener('click', () => {
                const input = icon.previousElementSibling;
                if (input.type === "password") {
                    input.type = "text";
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                } else {
                    input.type = "password";
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                }
            });
        });

        // Password Strength Logic
        function checkPasswordStrength(password) {
            const bar = document.getElementById('strength-bar');
            const text = document.getElementById('strength-text');
            let strength = 0;
            
            if (password.length >= 6) strength++;
            if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
            if (password.match(/\d/)) strength++;
            if (password.match(/[^a-zA-Z\d]/)) strength++;

            const colors = ['#ef4444', '#f59e0b', '#3b82f6', '#10b981'];
            const texts = ['Weak', 'Fair', 'Good', 'Strong'];
            const widths = ['25%', '50%', '75%', '100%'];

            if (password.length === 0) {
                bar.style.width = '0%';
                text.innerText = 'Password strength';
                text.style.color = '#94a3b8';
            } else {
                bar.style.width = widths[strength - 1] || '10%';
                bar.style.backgroundColor = colors[strength - 1] || colors[0];
                text.innerText = texts[strength - 1] || texts[0];
                text.style.color = colors[strength - 1] || colors[0];
            }
        }

        // File Upload Preview
        document.getElementById('file-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const preview = document.getElementById('avatarPreview');
                    const icon = document.getElementById('defaultAvatarIcon');
                    preview.src = event.target.result;
                    preview.style.display = 'block';
                    icon.style.display = 'none';
                    currentAvatarUrl = event.target.result; // This will be base64
                    document.getElementById('selectedAvatarUrl').value = 'uploaded';
                    
                    // Clear selected class from dicebear avatars
                    document.querySelectorAll('.avatar-option').forEach(img => img.classList.remove('selected'));
                };
                reader.readAsDataURL(file);
            }
        });

        async function register(event) {
            event.preventDefault();

            const fullname = document.getElementById("fullname").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm-password").value;
            const role = document.getElementById("role").value;
            const designation = document.getElementById("designation").value;
            const avatarUrl = document.getElementById('selectedAvatarUrl').value;

            if (!fullname || !email || !password) {
                showToast("Please fill all mandatory fields.", "error");
                return;
            }

            if (password !== confirmPassword) {
                showToast("Passwords do not match.", "error");
                return;
            }

            if (password.length < 6) {
                showToast("Password must be at least 6 characters.", "error");
                return;
            }

            const btn = event.currentTarget.tagName === 'BUTTON' ? event.currentTarget : document.querySelector('.glass-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Processing...';
            btn.disabled = true;

            try {
                // Determine if we should send the image as a file or a URL
                const formData = new FormData();
                formData.append('name', fullname);
                formData.append('email', email);
                formData.append('password', password);
                formData.append('role', role);
                formData.append('designation', designation);
                
                if (document.getElementById('file-upload').files[0]) {
                    formData.append('profile_image', document.getElementById('file-upload').files[0]);
                } else if (avatarUrl && avatarUrl !== 'uploaded') {
                    formData.append('profile_image_url', avatarUrl);
                }

                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    // Note: When sending FormData, don't set Content-Type header manually
                    body: formData
                });

                const data = await res.json();

                if (res.ok) {
                    showToast("Account created successfully!");
                    setTimeout(() => {
                        window.location.href = "index.html?registered=true";
                    }, 1500);
                } else {
                    showToast(data.message || "Registration failed.", "error");
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                console.error("Register error:", error);
                showToast("Connection error. Please try again.", "error");
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>

</html>
