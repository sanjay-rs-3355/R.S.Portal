<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Users - R.S.Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div class="layout">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">
                <img src="assets/logo.jpg" alt="R.S.Portal Logo">
                <span>R.S.Portal</span>
            </div>
            <ul class="nav">
                <li onclick="window.location.href='dashboard.html'">
                    <i class="fa-solid fa-border-all"></i> &nbsp; Dashboard
                </li>

                <li onclick="window.location.href='project.html'">
                    <i class="fa-regular fa-folder"></i> &nbsp; Projects
                </li>

                <li onclick="window.location.href='tasks.html'">
                    <i class="fa-regular fa-circle-check"></i> &nbsp; Tasks
                </li>

                <li class="active" id="admin-users-link" style="display:none;"
                    onclick="window.location.href='users.html'">
                    <i class="fa-solid fa-users"></i> &nbsp; Users
                </li>
            </ul>
            <div class="bottom-menu">
                <div onclick="logout()" style="cursor: pointer;"><i class="fa-solid fa-arrow-right-from-bracket"></i>
                    &nbsp; Log Out</div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main">
            <!-- Topbar -->
            <div class="topbar">
                <div class="top-left">
                    <div class="breadcrumb">Pages / <span class="crumb-active">Users</span></div>
                    <div class="page-subtitle">User Management</div>
                </div>
                <div class="top-right">
                    <div class="search-wrapper">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input type="text" class="search" placeholder="Search users...">
                    </div>
                    <div class="notification">
                        <i class="fa-regular fa-bell"></i>
                        <span class="notif-dot"></span>
                    </div>
                    <div class="user">
                        <div class="user-avatar" id="user-avatar">U</div>
                        <span class="arrow"><i class="fa-solid fa-chevron-down"></i></span>
                    </div>
                </div>
            </div>

            <!-- Page Content -->
            <div class="dashboard-area">
                <h2>User Management</h2>
                <div class="card-box">
                    <table class="data-table" id="users-table">
                        <thead>
                            <tr>
                                <th>User</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const token = localStorage.getItem("token");
        if (!token) window.location.href = "index.html";

        // Handle Back Button (bfcache)
        window.addEventListener('pageshow', function (event) {
            if (!localStorage.getItem("token")) {
                window.location.href = "index.html";
            }
        });

        async function initPage() {
            try {
                // Determine role
                const res = await fetch("http://localhost:5000/api/dashboard", {
                    headers: { "Authorization": "Bearer " + token }
                });
                const data = await res.json();
                const role = data.role || 'member';
                if (role !== 'admin') {
                    alert("Unauthorized access");
                    window.location.href = "dashboard.html";
                    return;
                }

                document.getElementById('admin-users-link').style.display = 'block';

                loadAllUsers();

            } catch (error) {
                console.error(error);
                logout();
            }
        }

        async function loadAllUsers() {
            try {
                const res = await fetch("http://localhost:5000/api/users", {
                    headers: { "Authorization": "Bearer " + token }
                });
                const users = await res.json();
                const tbody = document.querySelector("#users-table tbody");
                tbody.innerHTML = "";

                users.forEach(u => {
                    tbody.innerHTML += `
                    <tr>
                        <td>
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <div class="user-avatar" style="background: #e2e8f0; color: #333;">${u.name.charAt(0)}</div>
                                <div>
                                    <div style="font-weight: 600;">${u.name}</div>
                                    <div style="font-size: 12px; color: #666;">${u.email}</div>
                                </div>
                            </div>
                        </td>
                        <td><span class="badge ${u.role}">${u.role}</span></td>
                        <td>${u.status}</td>
                        <td>
                            <button class="btn-icon" onclick="deleteUser(${u.id})"><i class="fa-regular fa-trash-can"></i></button>
                        </td>
                    </tr>
                `;
                });
            } catch (e) { console.error(e); }
        }

        async function deleteUser(id) {
            if (!confirm("Are you sure you want to delete this user?")) return;
            // Implementation for delete user (fetching backend generic delete likely)
            // Currently not fully implemented in dashboard.html snippet provided earlier but button was there.
            // Assuming similar API structure:
            /*
            const res = await fetch(`http://localhost:5000/api/users/${id}`, {
                method: 'DELETE',
                headers: { "Authorization": "Bearer " + token }
            });
            if(res.ok) loadAllUsers();
            */
            alert("Delete functionality not yet connected in backend for users.");
        }

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }

        initPage();
    </script>
</body>

</html>
