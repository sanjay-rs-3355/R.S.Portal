<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script src="app.js"></script>
    <script>
        // Use the global goToDashboard from app.js
        // If app.js isn't loaded fast enough, we inline the logic just in case, 
        // but app.js is src'd above.
        window.onload = function () {
            const token = localStorage.getItem("token");
            if (!token) {
                window.location.href = "index.html";
            } else {
                goToDashboard();
            }
        }
    </script>
</head>

<body>
    <p>Redirecting to your dashboard...</p>
</body>

</html>
