<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Chat - R.S.Portal</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="chat.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="app.js"></script>
</head>

<body>
    <!-- Premium Preloader -->
    <div id="preloader" class="preloader">
        <div class="loader-logo">
            <img src="assets/logo.jpg" alt="Logo">
        </div>
        <div class="loader-track">
            <div class="loader-bar"></div>
        </div>
    </div>

    <div id="toast-container"></div>

    <div class="layout">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">
                <img src="assets/logo.jpg" alt="R.S.Portal Logo">
                <span>R.S.Portal</span>
            </div>
            <ul class="nav">
                <li id="navDashboard">
                    <i class="fa-solid fa-border-all"></i> &nbsp; Dashboard
                </li>
                <li id="navProjects">
                    <i class="fa-regular fa-folder"></i> &nbsp; Projects
                </li>
                <li id="navTasks">
                    <i class="fa-regular fa-circle-check"></i> &nbsp; Tasks
                </li>
                <li id="navUsers" style="display:none;">
                    <i class="fa-solid fa-users"></i> &nbsp; Users
                </li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="main">
            <!-- Topbar -->
            <div class="topbar">
                <div class="top-left reveal" style="animation-delay: 0.1s;">
                    <div class="breadcrumb">Pages / <span class="crumb-active">Chat</span></div>
                    <div class="page-subtitle">Team Communication</div>
                </div>
                <div class="top-right">
                    <div class="search-wrapper">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input type="text" class="search" placeholder="Search messages...">
                    </div>
                    <div class="notification" id="notifBtn" style="cursor: pointer; position: relative;">
                        <i class="fa-regular fa-bell"></i>
                        <span class="notif-dot" id="notifDot" style="display: none;"></span>
                        <div class="notif-dropdown" id="notifDropdown">
                            <div class="notif-header">
                                <span>Notifications</span>
                                <button id="markAllRead" class="btn-text-sm">Clear All</button>
                            </div>
                            <div class="notif-list" id="notifList">
                                <p class="notif-empty">No new notifications</p>
                            </div>
                        </div>
                    </div>
                    <div class="user" id="userMenuBtn" style="cursor: pointer; position: relative;">
                        <div class="user-avatar" id="user-avatar"></div>
                        <span id="usernameDisplay"
                            style="font-weight: 600; color: var(--text-color); margin-right: 4px;">User</span>
                        <span class="arrow"><i class="fa-solid fa-chevron-down"></i></span>
                        <div class="user-dropdown" id="userDropdown">
                            <div class="dropdown-item" onclick="window.location.href='profile.html'">
                                <i class="fa-regular fa-user"></i> My Profile
                            </div>
                            <div class="dropdown-item" onclick="logout()">
                                <i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Page Content -->
            <div class="dashboard-area">
                <div class="chat-container">

                    <!-- Chat Sidebar (Project List) -->
                    <div class="chat-sidebar">
                        <div class="chat-sidebar-header">
                            <h3 style="margin: 0; font-size: 16px;">Teams / Groups</h3>
                            <div class="chat-search-wrapper">
                                <i class="fa-solid fa-magnifying-glass chat-search-icon"></i>
                                <input type="text" id="projectSearch" class="chat-search-input"
                                    placeholder="Search teams...">
                            </div>
                        </div>
                        <div class="chat-list" id="projectList">
                            <p style="padding: 20px; text-align: center; color: #94a3b8;">Loading teams...</p>
                        </div>
                    </div>

                    <!-- Chat Main Area -->
                    <div class="chat-main">
                        <div class="chat-main-header">
                            <div class="chat-item-avatar" id="activeChatAvatar"
                                style="background: #f1f5f9; color: #94a3b8;"><i class="fa-solid fa-hashtag"></i></div>
                            <div style="flex: 1;">
                                <h3 style="margin: 0; font-size: 16px;" id="activeChatTitle">Select a project</h3>
                                <span style="font-size: 12px; color: #64748b;" id="activeChatSubtitle">Choose a team to
                                    start messaging</span>
                            </div>
                            <div id="onlineCount" style="font-size: 12px; color: #10b981; font-weight: 600;"></div>
                        </div>

                        <div class="chat-messages-area" id="chatMessages">
                            <div
                                style="display: flex; height: 100%; align-items: center; justify-content: center; color: #94a3b8; flex-direction: column;">
                                <i class="fa-regular fa-comments"
                                    style="font-size: 48px; opacity: 0.3; margin-bottom: 16px;"></i>
                                <p style="font-weight: 500;">Select a project to view messages</p>
                            </div>
                        </div>

                        <div id="typingIndicator" class="typing-indicator" style="visibility: hidden;">
                            <span id="typingText">User is typing</span>
                            <div class="typing-dots">
                                <div class="dot"></div>
                                <div class="dot"></div>
                                <div class="dot"></div>
                            </div>
                        </div>

                        <div class="chat-input-area">
                            <div class="chat-input-container">
                                <input type="text" class="chat-input-field" id="messageInput"
                                    placeholder="Type a message..." disabled>
                            </div>
                            <button class="chat-send-btn" id="sendMessageBtn" disabled>
                                <i class="fa-solid fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="animations.js"></script>
    <script>
        // Important: token and socket are already defined in app.js
        // We need to use the same socket instance from app.js
        const chatToken = localStorage.getItem("token");
        // Create a dedicated chat socket if global one isn't available
        const chatSocket = (typeof socket !== 'undefined' && socket) ? socket : io(window.location.origin, {
            auth: { token: chatToken }
        });

        let currentProjectId = null;
        let currentUser = null;
        let allProjects = [];
        let typingTimeout = null;

        document.addEventListener('DOMContentLoaded', () => {
            setupNavigation(); // from app.js
            initPage();
            setupSocketListeners();
            setupChatListeners();
        });

        function setupChatListeners() {
            document.getElementById('sendMessageBtn')?.addEventListener('click', sendMessage);
            document.getElementById('messageInput')?.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });

            // Search
            document.getElementById('projectSearch')?.addEventListener('input', (e) => {
                filterProjects(e.target.value);
            });

            // Typing Indicator Emitter
            document.getElementById('messageInput')?.addEventListener('input', () => {
                if (!currentProjectId) return;
                chatSocket.emit('typing');

                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => {
                    chatSocket.emit('stopTyping');
                }, 2000);
            });
        }

        async function initPage() {
            chatToken = localStorage.getItem('token');
            if (!chatToken) { window.location.href = 'index.html'; return; }
            currentUser = parseJwt(chatToken);
            setupNavigation();
            setupTopbar();
            await loadProjects();
        }

        async function loadProjects() {
            const list = document.getElementById('projectList');
            try {
                allProjects = await apiGet('/api/projects') || [];
                renderProjects(allProjects);
            } catch (e) {
                list.innerHTML = `<p style="padding: 20px; text-align: center; color: #ef4444;">Error loading teams.</p>`;
            }
        }

        function renderProjects(projects) {
            const list = document.getElementById('projectList');
            list.innerHTML = "";

            if (!projects || projects.length === 0) {
                list.innerHTML = `<p style="padding: 20px; text-align: center; color: #94a3b8;">No teams found.</p>`;
                return;
            }

            projects.forEach((p, i) => {
                const div = document.createElement('div');
                div.className = `chat-item ${currentProjectId === (p.id || p._id) ? 'active' : ''}`;
                div.onclick = () => selectProject(p);

                const initial = (p.title || 'P').charAt(0).toUpperCase();
                const color = avatarColor(p.title);

                div.innerHTML = `
                        <div class="chat-item-avatar" style="background: ${color};">${initial}</div>
                        <div class="chat-item-info">
                            <div class="chat-item-name">${escapeHTML(p.title)}</div>
                            <div class="chat-item-last">Project communication</div>
                        </div>
                    `;
                list.appendChild(div);
            });
        }

        function filterProjects(query) {
            const q = query.toLowerCase().trim();
            if (q === '') {
                renderProjects(allProjects);
                return;
            }
            let filtered = allProjects.filter(p =>
                p.title.toLowerCase().includes(q) ||
                String(p.id || '').toLowerCase().includes(q) ||
                String(p._id || '').toLowerCase().includes(q)
            );
            filtered = sortSearchResults(filtered, q, ['title', 'id', '_id']);
            renderProjects(filtered);
        }

        async function selectProject(project) {
            currentProjectId = project.id || project._id;

            // UI
            document.getElementById('activeChatTitle').innerText = project.title;
            document.getElementById('activeChatSubtitle').innerText = "Team Room";
            document.getElementById('activeChatAvatar').innerHTML = project.title.charAt(0).toUpperCase();
            document.getElementById('activeChatAvatar').style.background = "#6366f1";
            document.getElementById('activeChatAvatar').style.color = "#ffffff";

            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendMessageBtn').disabled = false;
            document.getElementById('messageInput').focus();

            renderProjects(allProjects); // Refresh list for active state

            chatSocket.emit('joinProject', currentProjectId);
            await loadChatHistory(currentProjectId);
        }

        async function loadChatHistory(projectId) {
            const container = document.getElementById('chatMessages');
            container.innerHTML = `<div style="display:flex; height:100%; align-items:center; justify-content:center;"><div class="dot" style="width:8px; height:8px; background:#6366f1;"></div></div>`;

            try {
                const messages = await apiGet(`/api/projects/${projectId}/messages`);

                container.innerHTML = "";
                if (!messages || messages.length === 0) {
                    container.innerHTML = `<div style="text-align:center; padding-top:100px; color:#94a3b8;"><i class="fa-regular fa-comment-dots" style="font-size:32px; display:block; margin-bottom:10px;"></i>No messages here yet.</div>`;
                } else {
                    messages.forEach(msg => appendMessage(msg));
                }
                container.scrollTop = container.scrollHeight;
            } catch (e) {
                console.error(e);
            }
        }

        function appendMessage(data) {
            const container = document.getElementById('chatMessages');
            if (container.querySelector('i')) container.innerHTML = ""; // Remove empty state

            const senderId = typeof data.sender === 'object' ? data.sender._id : data.sender_id || data.sender;
            const senderName = typeof data.sender === 'object' ? data.sender.name : (data.userName || "User");
            const isSelf = senderId === currentUser.id || data.userId === currentUser.id;

            const time = data.timestamp ? new Date(data.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "";

            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${isSelf ? 'self' : 'other'}`;

            wrapper.innerHTML = `
                ${!isSelf ? `<span class="message-sender">${escapeHTML(senderName)}</span>` : ''}
                <div class="message ${isSelf ? 'self' : 'other'}">
                    ${escapeHTML(data.message || data.content)}
                    <div class="message-time">${time}</div>
                </div>
            `;

            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message || !currentProjectId) return;

            chatSocket.emit('sendMessage', { message });
            input.value = "";
            chatSocket.emit('stopTyping');
        }

        function setupSocketListeners() {
            chatSocket.on('receiveMessage', (data) => {
                if (currentProjectId && (data.projectId === currentProjectId || data.project === currentProjectId)) {
                    appendMessage(data);
                }
            });

            chatSocket.on('userTyping', (userId) => {
                if (userId !== currentUser.id) {
                    const indicator = document.getElementById('typingIndicator');
                    indicator.style.visibility = 'visible';
                }
            });

            chatSocket.on('userStoppedTyping', (userId) => {
                const indicator = document.getElementById('typingIndicator');
                indicator.style.visibility = 'hidden';
            });

            chatSocket.on('teamPresence', (presenceMap) => {
                const users = Object.values(presenceMap).filter(status => status === 'online');
                const count = document.getElementById('onlineCount');
                if (count) count.innerText = `${users.length} online`;
            });

            chatSocket.on('errorMessage', (msg) => {
                showToast(msg, "error");
            });

            chatSocket.on('connect_error', (err) => {
                console.error("Socket error:", err.message);
                showToast("Connection error. Retrying...", "warning");
            });
        }

        // Global logout handled by app.js
    </script>
</body>

</html>
