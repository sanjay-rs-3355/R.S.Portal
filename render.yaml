services:
  # MySQL Private Service
  - type: pvt
    name: collaboration-db
    env: docker
    dockerfilePath: Dockerfile.mysql
    region: ohio # Change as needed
    plan: free # Only if using paid, change to 'starter' or higher for disks
    envVars:
      - key: MYSQL_DATABASE
        value: collaboration_portal
      - key: MYSQL_USER
        fromContext: db_user
      - key: MYSQL_PASSWORD
        fromContext: db_password
      - key: MYSQL_ROOT_PASSWORD
        fromContext: db_root_password
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10

  # Node.js Web Service (Backend)
  - type: web
    name: collaboration-portal-api
    env: node
    region: ohio
    plan: free
    buildCommand: npm install && cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: DB_HOST
        fromService:
          type: pvt
          name: collaboration-db
          property: host
      - key: DB_USER
        fromContext: db_user
      - key: DB_PASSWORD
        fromContext: db_password
      - key: DB_NAME
        value: collaboration_portal
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000
