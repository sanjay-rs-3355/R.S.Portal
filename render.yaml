services:
  # MySQL Private Service
  - type: pvt
    name: collaboration-db
    env: docker
    dockerfilePath: Dockerfile.mysql
    region: frankfurt
    plan: free
    envVars:
      - key: MYSQL_DATABASE
        value: collaboration_portal
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_ROOT_PASSWORD
        sync: false

  # Node.js Web Service (Backend)
  - type: web
    name: collaboration-portal-api
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install && cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: DB_HOST
        fromService:
          type: pserv
          name: collaboration-db
          property: host
      - key: DB_USER
        fromService:
          type: pserv
          name: collaboration-db
          property: user
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: collaboration-db
          property: password
      - key: DB_NAME
        value: collaboration_portal
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000
