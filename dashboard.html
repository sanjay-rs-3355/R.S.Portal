<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Dashboard - R.S.Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <div class="layout">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">
                <img src="assets/logo.jpg" alt="R.S.Portal Logo">
                <span>R.S.Portal</span>
            </div>
            <ul class="nav">
                <li class="active" onclick="window.location.href='dashboard.html'">
                    <i class="fa-solid fa-border-all"></i> &nbsp; Dashboard
                </li>

                <li onclick="window.location.href='project.html'">
                    <i class="fa-regular fa-folder"></i> &nbsp; Projects
                </li>

                <li onclick="window.location.href='tasks.html'">
                    <i class="fa-regular fa-circle-check"></i> &nbsp; Tasks
                </li>

                <li id="admin-users-link" style="display:none;" onclick="window.location.href='users.html'">
                    <i class="fa-solid fa-users"></i> &nbsp; Users
                </li>
            </ul>
            <div class="bottom-menu">
                <div onclick="logout()" style="cursor: pointer;"><i class="fa-solid fa-arrow-right-from-bracket"></i>
                    &nbsp; Log Out</div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main">
            <!-- Topbar -->
            <div class="topbar">
                <div class="top-left">
                    <div class="breadcrumb">Pages / <span class="crumb-active">Dashboard</span></div>
                    <div class="page-subtitle">Welcome back, <span id="username-display">User</span></div>
                </div>
                <div class="top-right">
                    <div class="search-wrapper">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input type="text" class="search" placeholder="Search type of keywords">
                    </div>
                    <div class="notification">
                        <i class="fa-regular fa-bell"></i>
                        <span class="notif-dot"></span>
                    </div>
                    <div class="user">
                        <div class="user-avatar" id="user-avatar">U</div>
                        <span class="arrow"><i class="fa-solid fa-chevron-down"></i></span>
                    </div>
                </div>
            </div>

            <!-- Dashboard Content -->
            <div class="dashboard-area" id="dashboard-section">
                <!-- Section 1: OVER-VIEW -->
                <h2 class="section-title">OVER-VIEW</h2>
                <div class="overview-grid">
                    <!-- Project Stats Card -->
                    <div class="card-box glass-card">
                        <div class="card-header">
                            <h3>Projects Stats</h3>
                            <div class="dropdown-pill">This Week <i class="fa-solid fa-caret-down"></i></div>
                        </div>
                        <div class="chart-container-doughnut">
                            <canvas id="projectStatsChart"></canvas>
                        </div>
                    </div>

                    <!-- Performance Card -->
                    <div class="card-box glass-card">
                        <div class="card-header">
                            <h3>Performance</h3>
                            <div class="dropdown-pill">This Week <i class="fa-solid fa-caret-down"></i></div>
                        </div>
                        <div class="chart-container-line">
                            <canvas id="performanceChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Section 2: ALL-Members -->
                <h2 class="section-title" style="margin-top: 20px;">Team Members</h2>
                <div class="members-section glass-card">
                    <div class="members-header">
                        <div class="header-left">
                            <h3>All Members (<span id="total-members-count">0</span>)</h3>
                            <div class="filter-chips">
                                <button class="filter-chip active" onclick="filterByRole('All')">All</button>
                                <button class="filter-chip" onclick="filterByRole('Developer')">Developer</button>
                                <button class="filter-chip" onclick="filterByRole('UI Designer')">UI Designer</button>
                                <button class="filter-chip" onclick="filterByRole('Tester')">Tester</button>
                                <button class="filter-chip" onclick="filterByRole('Manager')">Manager</button>
                            </div>
                        </div>
                        <div class="header-right">
                            <div class="search-bar-member">
                                <i class="fa-solid fa-magnifying-glass"></i>
                                <input type="text" id="memberSearch" placeholder="Search..." onkeyup="filterMembers()">
                            </div>
                        </div>
                    </div>

                    <div class="members-grid" id="members-grid-container">
                        <!-- Injected via JS -->
                    </div>

                    <div class="pagination-controls">
                        <button onclick="changePage(-1)">Previous</button>
                        <div id="pagination-numbers">
                            <button class="active">1</button>
                            <button>2</button>
                            <button>3</button>
                        </div>
                        <button onclick="changePage(1)">Next</button>
                    </div>
                </div>
            </div>

            <!-- Placeholder for other sections -->


        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // Immediate Token Check
        const token = localStorage.getItem("token");
        if (!token) {
            window.location.href = "index.html";
        }

        // Handle Back Button (bfcache)
        window.addEventListener('pageshow', function (event) {
            if (!localStorage.getItem("token")) {
                window.location.href = "index.html";
            }
        });

        // Decoded token mock (In real app, parse JWT)
        // For now, we fetch dashboard to get role

        let currentUserRole = 'member';

        // Initialize
        initDashboard();

        async function initDashboard() {
            try {
                const res = await fetch("http://localhost:5000/api/dashboard", {
                    headers: { "Authorization": "Bearer " + token }
                });
                if (!res.ok) throw new Error("Failed");
                const data = await res.json();

                // Set User Name
                document.getElementById("username-display").innerText = data.name || "User";

                // Render Charts
                renderProjectStatsChart(data);
                renderPerformanceChart();

                // Render Members
                fetchMembersForGrid();

                if (data.role === 'admin') {
                    document.getElementById('admin-users-link').style.display = 'block';
                }

            } catch (error) {
                console.error(error);
            }
        }

        // 1. Project Stats Chart (Doughnut)
        function renderProjectStatsChart(data) {
            const ctx = document.getElementById('projectStatsChart').getContext('2d');

            // Map data to categories: [Completed, On Hold(0), On Progress(In Prog), Pending]
            const values = [
                data.completedTasks || 0,
                0, // On Hold (Mocked as 0 for now as db doesn't have it)
                data.inProgressTasks || data.highPriorityTasks || 0, // Using InProgress or HighPrio as proxy
                data.pendingTasks || 0
            ];

            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Completed', 'On Hold', 'On Progress', 'Pending'],
                    datasets: [{
                        data: values,
                        backgroundColor: ['#10b981', '#6366f1', '#3b82f6', '#ef4444'],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right', labels: { usePointStyle: true, boxWidth: 8 } }
                    },
                    cutout: '60%'
                }
            });
        }

        // 2. Performance Chart (Line - Mocked)
        function renderPerformanceChart() {
            const ctx = document.getElementById('performanceChart').getContext('2d');

            // Gradient fill
            const gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, 'rgba(99, 102, 241, 0.2)');
            gradient.addColorStop(1, 'rgba(99, 102, 241, 0)');

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Oct 2021', 'Nov 2021', 'Dec 2021', 'Jan 2022', 'Feb 2022'],
                    datasets: [
                        {
                            label: 'Achieved',
                            data: [2.5, 3.8, 1.8, 4.2, 3.5],
                            borderColor: '#f59e0b',
                            tension: 0.4,
                            pointRadius: 0,
                            borderWidth: 3
                        },
                        {
                            label: 'Target',
                            data: [0.5, 2.2, 0.5, 3.2, 1.2],
                            borderColor: '#6366f1',
                            tension: 0.4,
                            pointRadius: 0,
                            borderWidth: 3,
                            fill: true,
                            backgroundColor: gradient
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { display: false, beginAtZero: true },
                        x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                    },
                    plugins: { legend: { position: 'top', align: 'start', labels: { usePointStyle: true } } }
                }
            });
        }

        // 3. Members Grid
        let allMembers = [];
        let currentFilterRole = 'All';

        async function fetchMembersForGrid() {
            try {
                const res = await fetch("http://localhost:5000/api/users", {
                    headers: { "Authorization": "Bearer " + token }
                });
                let users = await res.json();

                // MOCK ROLES for demonstration
                const mockRoles = ['Developer', 'UI Designer', 'Tester', 'Manager', 'Team Leader'];
                allMembers = users.map(u => ({
                    ...u,
                    jobTitle: mockRoles[Math.floor(Math.random() * mockRoles.length)] // Assign random role
                }));

                document.getElementById('total-members-count').innerText = allMembers.length;
                renderMembers(allMembers);
            } catch (e) { console.error(e); }
        }

        function renderMembers(members) {
            const container = document.getElementById('members-grid-container');
            container.innerHTML = "";
            const colors = ['#f87171', '#fbbf24', '#34d399', '#60a5fa', '#818cf8', '#a78bfa', '#f472b6'];

            if (members.length === 0) {
                container.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:#94a3b8;">No members found.</p>`;
                return;
            }

            members.forEach((m, index) => {
                const color = colors[index % colors.length];
                const avatarHTML = `<div class="member-avatar-lg" style="background:${color}; display:flex; align-items:center; justify-content:center; color:white; font-size:20px; font-weight:bold;">${m.name.charAt(0)}</div>`;

                container.innerHTML += `
                    <div class="member-card">
                        ${avatarHTML}
                        <div class="member-card-name">${m.name}</div>
                        <div class="member-card-role">${m.jobTitle}</div>
                    </div>
                `;
            });
        }

        function filterByRole(role) {
            currentFilterRole = role;

            // Update active button state
            document.querySelectorAll('.filter-chip').forEach(btn => {
                if (btn.innerText === role) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            applyFilters();
        }

        function filterMembers() {
            applyFilters();
        }

        function applyFilters() {
            const term = document.getElementById('memberSearch').value.toLowerCase();

            const filtered = allMembers.filter(m => {
                const matchesSearch = m.name.toLowerCase().includes(term);
                const matchesRole = currentFilterRole === 'All' || m.jobTitle === currentFilterRole;
                return matchesSearch && matchesRole;
            });

            renderMembers(filtered);
        }

        // Pagination (Visual only for now)
        function changePage(direction) {
            // Logic to be implemented with real large datasets
        }

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }

        initDashboard();
    </script>

</body>

</html>
