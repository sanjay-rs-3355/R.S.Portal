<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>My Tasks - R.S.Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="tasks.css">
    <link rel="stylesheet" href="users.css">
    <link rel="stylesheet" href="chat.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div id="toast-container"></div>
    <div class="layout">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">
                <img src="assets/logo.jpg" alt="R.S.Portal Logo">
                <span>R.S.Portal</span>
            </div>
            <ul class="nav">
                <li onclick="goToDashboard()">
                    <i class="fa-solid fa-border-all"></i> &nbsp; Dashboard
                </li>

                <li onclick="window.location.href='project.html'">
                    <i class="fa-regular fa-folder"></i> &nbsp; Projects
                </li>

                <li class="active" onclick="window.location.href='tasks.html'">
                    <i class="fa-regular fa-circle-check"></i> &nbsp; Tasks
                </li>

                <li id="admin-users-link" style="display:none;" onclick="window.location.href='users.html'">
                    <i class="fa-solid fa-users"></i> &nbsp; Users
                </li>
            </ul>
            <div class="bottom-menu">
                <div onclick="logout()" style="cursor: pointer;"><i class="fa-solid fa-arrow-right-from-bracket"></i>
                    &nbsp; Log Out</div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main">
            <!-- Topbar -->
            <div class="topbar">
                <div class="top-left">
                    <div class="breadcrumb">Pages / <span class="crumb-active">Tasks</span></div>
                    <div class="page-subtitle">Manage your tasks</div>
                </div>
                <div class="top-right">
                    <div class="search-wrapper">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input type="text" class="search" placeholder="Search tasks...">
                    </div>
                    <div class="notification">
                        <i class="fa-regular fa-bell"></i>
                        <span class="notif-dot"></span>
                    </div>
                    <div class="user">
                        <div class="user-avatar" id="user-avatar">U</div>
                        <span class="arrow"><i class="fa-solid fa-chevron-down"></i></span>
                    </div>
                </div>
            </div>

            <!-- Page Content -->
            <div class="dashboard-area">
                <h2 class="page-title">My Tasks</h2>
                <div class="card-box">
                    <table class="data-table" id="tasks-table">
                        <thead>
                            <tr>
                                <th>Task</th>
                                <th>Project</th>
                                <th>Priority</th>
                                <th>Status</th>
                                <th>Deadline</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <!-- MODALS -->
            <div id="taskDetailsModal" class="modal">
                <div class="modal-content" style="width: 500px;">
                    <span class="close" onclick="closeModal('taskDetailsModal')">&times;</span>
                    <h2 id="modalTaskTitle">Task Title</h2>
                    <div style="margin-bottom: 20px;">
                        <span id="modalTaskProject" class="badge member">Project Name</span>
                        <span id="modalTaskPriority" class="badge">Priority</span>
                        <span id="modalTaskDeadline" style="margin-left: 10px; font-size: 13px; color: #64748b;"></span>
                    </div>

                    <p id="modalTaskDesc" style="color: #475569; line-height: 1.6; margin-bottom: 20px;">No description
                        provided.</p>

                    <div style="background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0;">
                        <label
                            style="display: block; font-size: 13px; font-weight: 600; color: #64748b; margin-bottom: 8px;">Update
                            Status:</label>
                        <select id="modalTaskStatus"
                            style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1;">
                            <option value="pending">Pending</option>
                            <option value="in_progress">In Progress</option>
                            <option value="completed">Completed</option>
                        </select>
                        <button class="btn-primary" style="width: 100%; margin-top: 15px;"
                            onclick="saveTaskStatus()">Update Status</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const token = localStorage.getItem("token");
        if (!token) window.location.href = "index.html";

        // Handle Back Button (bfcache)
        window.addEventListener('pageshow', function (event) {
            if (!localStorage.getItem("token")) {
                window.location.href = "index.html";
            }
        });

        let userTasks = []; // Global store

        async function initPage() {
            try {
                // Determine role for sidebar link
                const user = parseJwt(token);
                if (user && user.role === 'admin') {
                    document.getElementById('admin-users-link').style.display = 'block';
                }

                // Set username/avatar
                if (user && user.name) {
                    document.getElementById("user-avatar").innerText = user.name.charAt(0).toUpperCase();
                } else {
                    document.getElementById("user-avatar").innerText = "U";
                }

                // Sidebar navigation helpers
                document.querySelector('.logo')?.addEventListener('click', () => window.location.href = 'index.html');

                fetchUserTasks();

            } catch (error) {
                console.error(error);
                logout();
            }
        }

        async function fetchUserTasks() {
            try {
                // ADMIN ACCESS: Fetch ALL tasks
                const user = parseJwt(token);
                const endpoint = (user && user.role === 'admin')
                    ? "http://localhost:5000/api/tasks"
                    : "http://localhost:5000/api/dashboard/tasks";

                const res = await fetch(endpoint, {
                    headers: { "Authorization": "Bearer " + token }
                });
                const tasks = await res.json();
                userTasks = tasks; // Store globally

                const tbody = document.querySelector("#tasks-table tbody");
                tbody.innerHTML = "";

                if (tasks.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='5'>No tasks assigned.</td></tr>";
                    return;
                }

                tasks.forEach(t => {
                    const deadline = t.deadline ? new Date(t.deadline).toLocaleDateString() : 'No deadline';
                    let priorityColor = '#10b981'; // green (low)
                    if (t.priority === 'medium') priorityColor = '#f59e0b'; // orange
                    if (t.priority === 'high') priorityColor = '#ef4444'; // red

                    let statusBadge = 'member';
                    if (t.status === 'completed') statusBadge = 'admin';

                    const taskId = t._id || t.id;

                    tbody.innerHTML += `
                        <tr onclick="openTaskDetails('${taskId}')" style="cursor: pointer;">
                            <td><div style="font-weight:600;">${t.title}</div></td>
                            <td>${t.projectTitle}</td>
                            <td><span style="color:${priorityColor}; font-weight:600; text-transform:capitalize;">${t.priority}</span></td>
                            <td><span class="badge ${statusBadge}">${t.status.replace('_', ' ')}</span></td>
                            <td>${deadline}</td>
                        </tr>
                    `;
                });

            } catch (e) {
                console.error(e);
                showToast("Failed to load tasks", "error");
            }
        }

        let currentTaskId = null;

        function openTaskDetails(id) {
            const task = userTasks.find(t => (t._id || t.id) == id);
            if (!task) return;

            currentTaskId = id;
            document.getElementById("modalTaskTitle").innerText = task.title;
            document.getElementById("modalTaskDesc").innerText = task.description || "No description provided.";
            document.getElementById("modalTaskProject").innerText = task.projectTitle || "Unknown Project";

            const priorityBadge = document.getElementById("modalTaskPriority");
            priorityBadge.innerText = task.priority;
            priorityBadge.className = `badge ${task.priority ? task.priority.toLowerCase() : 'medium'}`;
            priorityBadge.style.color = 'inherit';

            const deadlineText = task.deadline ? new Date(task.deadline).toLocaleDateString() : 'No Deadline';
            document.getElementById("modalTaskDeadline").innerText = `Due: ${deadlineText}`;

            document.getElementById("modalTaskStatus").value = task.status;

            document.getElementById("taskDetailsModal").style.display = "flex";
        }

        async function saveTaskStatus() {
            const newStatus = document.getElementById("modalTaskStatus").value;
            try {
                const res = await fetch(`http://localhost:5000/api/tasks/${currentTaskId}/status`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify({ status: newStatus })
                });

                if (res.ok) {
                    showToast(`Task marked as ${newStatus.replace('_', ' ')}`);
                    closeModal('taskDetailsModal');
                    fetchUserTasks(); // Refresh list
                } else {
                    showToast("Failed to update status", "error");
                }
            } catch (e) { console.error(e); showToast("Server error", "error"); }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = "none";
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<div class="toast-content">${message}</div>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'fadeOut 0.3s forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function goToDashboard() {
            const user = parseJwt(token);
            if (user) {
                window.location.href = user.role === 'admin' ? 'admin-dashboard.html' : 'member-dashboard.html';
            } else {
                window.location.href = 'index.html';
            }
        }

        window.onclick = function (event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = "none";
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }

        initPage();
    </script>
</body>

</html>
